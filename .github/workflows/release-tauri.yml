name: Release VoicePaste cross-platform

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example v2.0.0)
        required: true
        default: v2.0.0
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # On a tag push ref_name is the tag; workflow_dispatch supplies it explicitly.
  # The same value drives checkout, asset publication and the release title.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            rust-target: aarch64-apple-darwin
            bundle: dmg,app
          - name: macOS x64
            os: macos-13
            rust-target: x86_64-apple-darwin
            bundle: dmg,app
          - name: Windows x64
            os: windows-2022
            rust-target: x86_64-pc-windows-msvc
            bundle: msi,nsis
          - name: Ubuntu x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bundle: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libssl-dev

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build macOS helper binaries
        if: runner.os == 'macOS'
        working-directory: VoicePasteTauri/src-tauri
        run: |
          swift build --product modifier_monitor -c release
          swift build --product native_stt -c release
          cp "$(find .build -path '*/release/modifier_monitor' -type f | head -1)" modifier_monitor-${{ matrix.rust-target }}
          cp "$(find .build -path '*/release/native_stt' -type f | head -1)" native_stt-${{ matrix.rust-target }}

      - name: Disable macOS-only helpers on non-macOS bundles
        if: runner.os != 'macOS'
        working-directory: VoicePasteTauri/src-tauri
        shell: bash
        run: python -c "import json; p='tauri.conf.json'; d=json.load(open(p)); d['bundle'].pop('externalBin', None); json.dump(d, open(p, 'w'), indent=2); open(p, 'a').write('\\n')"

      - name: Build installer bundle
        working-directory: VoicePasteTauri/src-tauri
        run: cargo tauri build --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundle }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/voicepaste-assets"
          find VoicePasteTauri/src-tauri/target -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} "$RUNNER_TEMP/voicepaste-assets/" \;
          test -n "$(find "$RUNNER_TEMP/voicepaste-assets" -type f -print -quit)"

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: VoicePaste-${{ matrix.rust-target }}
          path: ${{ runner.temp }}/voicepaste-assets/*
          if-no-files-found: error

  publish:
    name: Publish one GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: VoicePaste-*
          path: release-assets
          merge-multiple: true

      - name: Publish exactly one release with all installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          VoicePaste ${{ env.RELEASE_TAG }}.

          Download the installer for macOS, Windows, or Ubuntu. Press the hotkey, speak, and release: the transcript is inserted into the active field.
          EOF
          gh release delete "${{ env.RELEASE_TAG }}" --yes 2>/dev/null || true
          gh release create "${{ env.RELEASE_TAG }}" release-assets/* \
            --title "VoicePaste ${{ env.RELEASE_TAG }}" \
            --notes-file release-notes.md
