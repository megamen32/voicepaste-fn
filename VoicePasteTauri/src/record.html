<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="recordTitle">VoicePaste - Record</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #252525;
            border-bottom: 1px solid #333;
        }
        .header h1 {
            font-size: 14px;
            font-weight: 500;
            color: #ccc;
        }
        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .close-btn:hover {
            background: #333;
            color: #fff;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
        }
        .transcript-area {
            flex: 1;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px;
            font-size: 15px;
            line-height: 1.5;
            color: #eee;
            overflow-y: auto;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .transcript-area:empty::before {
            content: "Transcription will appear here...";
            color: #666;
            font-style: italic;
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mic-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: #007aff;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .mic-btn:hover {
            background: #0051d5;
            transform: scale(1.05);
        }
        .mic-btn.recording {
            background: #ff3b30;
            animation: pulse 1.5s infinite;
        }
        .mic-btn.recording:hover {
            background: #d32f2f;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255, 59, 48, 0); }
        }
        .status {
            flex: 1;
            font-size: 13px;
            color: #888;
        }
        .status.recording {
            color: #ff3b30;
        }
        .status.processing {
            color: #ffcc00;
            animation: status-pulse 1.2s ease-in-out infinite;
        }
        .status.error {
            color: #ff8a80;
        }
        @keyframes status-pulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }
        .copy-btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            background: #333;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background: #444;
        }
        .copy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 data-i18n="recordTitle">VoicePaste Record</h1>
        <button class="close-btn" data-i18n-title="close" onclick="closeWindow()">✕</button>
    </div>
    <div class="content">
        <div class="transcript-area" id="transcript" data-i18n="transcriptPlaceholder"></div>
        <div class="controls">
            <button class="mic-btn" id="mic-btn" onclick="toggleRecording()">🎤</button>
            <span class="status" id="status" data-i18n="clickMic">Click mic to start</span>
            <button class="copy-btn" id="copy-btn" data-i18n="copy" onclick="copyText()" disabled>Copy</button>
        </div>
    </div>

    <script src="locale.js"></script>
    <script>
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;
        let isRecording = false;
        let isProcessing = false;
        let transcript = "";

        const t = (key) => window.voicePasteI18n.t(key);
        async function initializeUiLanguage() {
            try {
                const language = await invoke("initialize_ui_language", {
                    locale: navigator.language || "",
                });
                window.voicePasteI18n.setLanguage(language);
            } catch (error) {
                window.voicePasteI18n.setLanguage(navigator.language || "en");
                console.error("UI language initialization failed:", error);
            }
        }

        initializeUiLanguage();
        listen("ui-language-changed", (event) => {
            window.voicePasteI18n.setLanguage(event.payload);
        });

        async function toggleRecording() {
            if (isProcessing) return;
            const micBtn = document.getElementById("mic-btn");
            const status = document.getElementById("status");
            const transcriptEl = document.getElementById("transcript");
            const copyBtn = document.getElementById("copy-btn");

            if (!isRecording) {
                // Start recording
                try {
                    const result = await invoke("start_record_mode");
                    if (result.success) {
                        isRecording = true;
                        micBtn.classList.add("recording");
                        micBtn.textContent = "⏹";
                        status.textContent = t("recording");
                        status.classList.add("recording");
                        status.classList.remove("error", "processing");
                        transcript = "";
                        transcriptEl.textContent = "";
                        copyBtn.disabled = true;
                    } else {
                        status.textContent = t("errorPrefix") + (result.error || t("couldNotStart"));
                        status.classList.add("error");
                    }
                } catch (e) {
                    status.textContent = t("errorPrefix") + e;
                    status.classList.add("error");
                }
            } else {
                // Stop recording
                isProcessing = true;
                micBtn.disabled = true;
                status.textContent = t("processing");
                status.classList.remove("recording", "error");
                status.classList.add("processing");
                let stopFailed = false;
                try {
                    const result = await invoke("stop_record_mode");
                    if (result.success) {
                        transcript = result.text || transcript;
                        transcriptEl.textContent = transcript;
                        copyBtn.disabled = !transcript;
                    } else {
                        stopFailed = true;
                        status.textContent = t("errorPrefix") + (result.error || t("couldNotStop"));
                        status.classList.add("error");
                    }
                } catch (e) {
                    stopFailed = true;
                    status.textContent = t("errorPrefix") + e;
                    status.classList.add("error");
                }
                isRecording = false;
                isProcessing = false;
                micBtn.disabled = false;
                micBtn.classList.remove("recording");
                micBtn.textContent = "🎤";
                status.classList.remove("processing", "recording");
                if (!stopFailed) {
                    status.textContent = t("clickMic");
                }
            }
        }

        async function copyText() {
            const text = document.getElementById("transcript").textContent;
            if (text) {
                try {
                    await invoke("copy_to_clipboard", { text });
                    document.getElementById("status").textContent = t("copied");
                    setTimeout(() => {
                        if (!isRecording) {
                            document.getElementById("status").textContent = t("clickMic");
                        }
                    }, 2000);
                } catch (e) {
                    console.error(e);
                }
            }
        }

        async function closeWindow() {
            try {
                if (isRecording) {
                    await invoke("stop_record_mode");
                }
                await invoke("hide_record_window");
            } catch (e) {
                console.error(e);
            }
        }

        // Listen for transcription updates
        listen("record-transcript", (event) => {
            const text = event.payload;
            transcript = text;
            document.getElementById("transcript").textContent = text;
            document.getElementById("copy-btn").disabled = !text;
        });
    </script>
</body>
</html>
