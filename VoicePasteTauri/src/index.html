<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoicePaste</title>
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div id="overlay" class="overlay hidden">
        <div id="content" class="content">
            <span id="spinner" class="spinner" aria-hidden="true"></span>
            <span id="text" class="text"></span>
            <button id="retry-button" class="retry-button hidden" type="button" data-i18n="retry">Retry</button>
        </div>
    </div>

    <!-- Dialogs -->
    <div id="dialog-endpoint" class="dialog hidden">
        <div class="dialog-inner">
            <h3 data-i18n="endpointTitle">Endpoint URL</h3>
            <input type="text" id="endpoint-input" data-i18n-placeholder="endpointPlaceholder" placeholder="https://api.openai.com/v1">
            <div class="dialog-buttons">
                <button id="endpoint-save" data-i18n="save">Save</button>
                <button id="endpoint-cancel" data-i18n="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <div id="dialog-api-key" class="dialog hidden">
        <div class="dialog-inner">
            <h3 data-i18n="apiKeyTitle">API Key</h3>
            <input type="password" id="api-key-input" data-i18n-placeholder="apiKeyPlaceholder" placeholder="sk-...">
            <div class="dialog-buttons">
                <button id="api-key-save" data-i18n="save">Save</button>
                <button id="api-key-cancel" data-i18n="cancel">Cancel</button>
            </div>
        </div>
    </div>

    <script src="locale.js"></script>
    <script src="overlay.js"></script>
</body>
</html>
