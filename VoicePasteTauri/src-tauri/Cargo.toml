[package]
name = "voicepaste-tauri"
version = "0.1.0"
edition = "2021"
default-run = "voicepaste"

[lib]
name = "voicepaste_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "voicepaste"
path = "src/main.rs"

[[bin]]
name = "voicepaste-model-probe"
path = "src/bin/model_probe.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", features = ["blocking", "multipart"] }

cpal = "0.15"
hound = "3.5"

whisper-rs = { version = "0.13", features = ["whisper-cpp-log"] }

directories = "5"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
parking_lot = "0.12"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["elcapitan"] }
core-foundation = "0.10"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux may need extra deps for cpal backend
alsa = "0.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
opt-level = "z"
